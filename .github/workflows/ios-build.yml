name: iOS Build and Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select available iPhone Simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d["isAvailable"] and d["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone Simulator runtime was found." >&2
            exit 1
          fi
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build Debug for iOS Simulator
        run: |
          xcodebuild \
            -project Worthly.xcodeproj \
            -scheme Worthly \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run XCTest suite
        run: |
          xcodebuild \
            -project Worthly.xcodeproj \
            -scheme Worthly \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build Release for iOS Simulator
        run: |
          xcodebuild \
            -project Worthly.xcodeproj \
            -scheme Worthly \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project Worthly.xcodeproj \
            -scheme Worthly \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/device/Build/Products/Release-iphoneos/Worthly.app"
          test -d "$APP_PATH"
          test -x "$APP_PATH/Worthly"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "Worthly-unsigned-${GITHUB_SHA::7}.ipa" Payload
          ls -lh Worthly-unsigned-*.ipa

      - name: Verify IPA is a device build
        run: |
          python3 .github/scripts/verify_device_app.py Payload/Worthly.app

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Worthly-unsigned-ipa
          path: Worthly-unsigned-*.ipa
          if-no-files-found: error
